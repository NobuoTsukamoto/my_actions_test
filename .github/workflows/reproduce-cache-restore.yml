name: Diagnose cache restore startup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cleanup: [none, opt, toolcache, apt, original]
    env:
      BUILD_DIR: /mnt/build
      SSTATE_DIR: /mnt/build/sstate-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, same as failing job

      - name: Diagnose cleanup
        env:
          CLEANUP_MODE: ${{ matrix.cleanup }}
        run: bash scripts/diagnose-cache-cleanup.sh

      - name: Prepare build directory
        run: |
          sudo mkdir -p "${BUILD_DIR}"
          sudo chown runner "${BUILD_DIR}"

      - name: Restore cache
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, same as failing job
        with:
          path: ${{ env.SSTATE_DIR }}
          key: cache-intel-corei7-64-master

      # Shell steps still run if the JavaScript action cannot start.
      - name: Record result
        if: always()
        env:
          CLEANUP_MODE: ${{ matrix.cleanup }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          {
            echo "## Cleanup: ${CLEANUP_MODE}"
            echo "Restore outcome: ${RESTORE_OUTCOME}"
            echo "Cache hit: ${CACHE_HIT:-unset}"
            echo 'See Diagnose cleanup for Node paths and the first failing operation.'
          } >> "$GITHUB_STEP_SUMMARY"
